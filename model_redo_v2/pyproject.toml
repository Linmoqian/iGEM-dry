[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igem-cmadre"
version = "0.1.0"
description = "Censor-aware, multi-analyte, domain-robust microcystin modeling pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "pyarrow>=15",
  "joblib>=1.3",
  "xgboost>=2.1",
  "lightgbm>=4.3",
  "catboost>=1.2.7",
  "torch>=2.3",
]

[project.optional-dependencies]
foundation = ["tabicl>=2.1,<3"]
explain = ["shap>=0.46", "matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.9"]
all = ["tabicl>=2.1,<3", "shap>=0.46", "matplotlib>=3.8", "seaborn>=0.13", "pytest>=8", "ruff>=0.9"]

[project.scripts]
cmadre = "cmadre.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
